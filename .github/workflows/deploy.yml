name: Deploy

# Builds the image, pushes it to a throwaway registry bound to the tailscale IP,
# and redeploys the Portainer stack. Runs on push to main, after Checks passes.
#
# Secrets (repo settings -> secrets):
#   PORTAINER_TOKEN  Portainer API key
#   REGISTRY_CERT    TLS cert for the localhost proxy (cert.pem)
#   REGISTRY_KEY     TLS key for the localhost proxy (key.pem)

on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: TLS proxy certificate
        run: |
          mkdir -p /tmp/tls
          printf '%s' "$REGISTRY_CERT" > /tmp/tls/cert.pem
          printf '%s' "$REGISTRY_KEY" > /tmp/tls/key.pem
          chmod 600 /tmp/tls/key.pem
        env:
          REGISTRY_CERT: ${{ secrets.REGISTRY_CERT }}
          REGISTRY_KEY: ${{ secrets.REGISTRY_KEY }}

      - name: Build, push, redeploy
        run: python3 ci/deploy.py
        env:
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          REGISTRY_IP: ${{ vars.REGISTRY_IP }}
          TLS_CERT_DIR: /tmp/tls

      - name: Verify the live site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://learn.hxhq.org.za/)
          echo "GET / -> $code"
          test "$code" = "200"
