<script>
'use strict';
const CHAPTER = { number: 21, title: 'Appeals and Reviews in Civil Proceedings', minutes: 10, language: 'en' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Appeals and Reviews in Civil Proceedings', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'SIP421 · Chapter 21', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Appeals and Reviews in Civil Proceedings', { x: 800, y: 430, size: 64, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'An appeal and a review test different things.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['idea', 'Key idea', (m) => {
    const p = panel(0);
    const rows = [["Appeal: a wrong answer", "answer"], ["Review: a wrong route", "route"], ["A gross irregularity causing prejudice", "gross"], ["MC appeal lies as of right", "asright"], ["MCR 51: 10, 15, 20 court days", "mcr51"], ["HC appeal needs leave: s 17, s 18", "leave"]];
    rows.forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 104, o: 0 });
      mk('circle', { cx: 200, cy: -10, r: 24, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: 0, size: 28, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 258, size: 30, weight: 500 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-mcappeal', prompt: ["An appeal from a Magistrates' Court..."],
    build: choice(["Requires leave to appeal", "Lies as of right, without leave", "Is heard by the Constitutional Court"], 1, "Correct: an appeal from a Magistrates' Court lies as of right; no leave is required.", [null, "Leave is required for High Court appeals, not Magistrates' Court appeals.", "It is heard by the High Court, not the Constitutional Court."]),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    const rows = [["To sum up.", "w1"], ["Appeal is a wrong answer; review is a wrong route.", "w2"], ["MC appeals lie as of right: 10, 15, 20 court days, then 40 and 60.", "w3"]];
    rows.forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-review', prompt: ["A mere irregularity is sufficient ground for review. True or false?"],
    build: choice(["True", "False"], 1, "Correct: the irregularity must be gross, and it must cause prejudice.", [null, "Incorrect: a gross irregularity causing prejudice is required."]),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
