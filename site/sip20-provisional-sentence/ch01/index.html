<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provisional Sentence Summons — SIP421</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 20, title: 'Provisional Sentence Summons', minutes: 10, language: 'en' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Provisional Sentence Summons', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'SIP421 · Chapter 20', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Provisional Sentence Summons', { x: 800, y: 430, size: 64, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'A liquid claim can be satisfied before the case is final.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['idea', 'Key idea', (m) => {
    const p = panel(0);
    const rows = [["Extraordinary, hybrid and speedy", "extraordinary"], ["A liquid document proves its own amount", "liquid"], ["Two separate onuses", "twoonus"], ["Twee Jonge Gezellen: three factors", "twee"], ["Provisional is not final", "notfinal"], ["Two months plus ten days", "months"]];
    rows.forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 104, o: 0 });
      mk('circle', { cx: 200, cy: -10, r: 24, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: 0, size: 28, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 258, size: 30, weight: 500 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-liquid', prompt: ["A liquid document is one that..."],
    build: choice(["Requires extrinsic evidence to prove the amount", "Needs no extrinsic evidence to prove the amount", "Must be a cheque or promissory note"], 1, "Correct: a liquid document proves its own amount on its face, without extrinsic evidence.", [null, "That is the defining feature of an illiquid document.", "Other documents may be liquid; the category is not closed."]),
  }], done) }],
  ['q2', 'Additional quick check', () => { panel(0); }, { dur: 12, ask: done => quiz(BAND, [{
    id: 'c-twee', prompt: ["Under Twee Jonge Gezellen, a court may refuse provisional sentence only where…"],
    build: choice(["Three factors coincide: the defendant cannot pay, the prospects are evenly balanced, and oral evidence may tip the balance", "The defendant has raised any bona fide defence", "The document is only partly liquid"], 0, "Correct: the constitutional discretion bites only where all three factors coincide; absent one, the procedure's efficiency is not limited.", ["Incorrect: the defendant's onus is to show the probabilities of success in the principal case favour them, which is not the same as any bona fide defence.", "Incorrect: partial liquidity affects the amount, not the court's discretion to refuse."]),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    const rows = [["To sum up.", "w1"], ["A liquid document needs no extrinsic evidence to prove the amount.", "w2"], ["Two onuses: the plaintiff proves the document; the defendant shows probability of success in the principal case.", "w3"]];
    rows.forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-twee', prompt: ["The Twee Jonge Gezellen factors are alternative: any one of them suffices. True or false?"],
    build: choice(["True", "False"], 1, "Correct: the three factors must coincide; the limitation bites only where all three are present.", [null, "Incorrect: the factors are cumulative, not alternative."]),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
