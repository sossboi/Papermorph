<title>"Breach, Remedies, the CPA and the Tribunal" — PRR400</title>

<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 2, title: "Breach, Remedies, the CPA and the Tribunal", minutes: 12, language: 'en', next: null };

/* ---------- chapter drawing helpers ---------- */
const text = (m, p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const row = (m, p, n, str, mark, y) => {
  const g = G(p, { x: -16, y, o: 0 });
  mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
  T(g, String(n), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
  // Wrap to a fixed pixel budget, then shrink the type if the block would still be
  // taller than one row pitch. The block is centred on y, and the line offsets are
  // LOCAL to the group (which already sits at y), so they are emitted as top - y.
  const words = str.split(' ');
  const TOP = 200, BOT = 884, MAXH = 84, AVAIL = 1000;
  const wrapAt = (size) => {
    const out = []; let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (line && uiW(t, size) > AVAIL) { out.push(line); line = w; } else { line = t; }
    }
    if (line) out.push(line);
    return out;
  };
  let size = 21, lines = wrapAt(21);
  for (const s of [32, 28, 24]) {
    const cand = wrapAt(s);
    if ((cand.length - 1) * 30 <= MAXH) { size = s; lines = cand; break; }
  }
  const lh = Math.min(30, MAXH / Math.max(1, lines.length - 1));
  let top = y - ((lines.length - 1) * lh) / 2;
  if (top < TOP) top = TOP;
  if (top + (lines.length - 1) * lh > BOT) top = BOT - (lines.length - 1) * lh;
  lines.forEach((l, i) => { T(g, l, { x: 260, y: top + i * lh - y, size, weight: 600 }); });
  tw(g, { o: 1, x: 0 }, m(mark), .6);
  return g;
};
const head = (p, str, y, t0, { size = 34, fill = COL.task, weight = 700 } = {}) => { const e = T(p, str, { x: 800, y, size, fill, anchor: 'middle', weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', '"PRR400 \u00b7 Study Unit 13"', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, "Breach, Remedies, the CPA and the Tribunal", { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, "Breach, Remedies, the CPA and the Tribunal", { x: 800, y: 430, size: 54, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(m, scene, "Breach, remedies, the Consumer Protection Act and the Tribunal.", 800, 600, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['breach', 'Breach', (m) => {
    const p = panel(0);
    head(p, "Breach", 150, .2, { size: 34 });
    row(m, p, 1, "Positive malperformance is where a party performs but the performance is defective or incomplete.", 'positive', 245);
    row(m, p, 2, "Mora debitoris is where the obligation must be due and the party fails to perform on time.", 'moradeb', 333);
    row(m, p, 3, "Mora creditoris is where the person who must receive performance delays co-operation or makes the debtor's performance impossible.", 'moracred', 421);
    row(m, p, 4, "Repudiation is where one party, by words or conduct, clearly shows they do not intend to perform.", 'repudiation', 509);
    row(m, p, 5, "Prevention of performance is where one party, through their own fault, makes it impossible for the other to perform.", 'prevention', 597);
  }],
  ['remedies', 'Remedies', (m) => {
    const p = panel(0);
    head(p, "Remedies", 150, .2, { size: 34 });
    row(m, p, 1, "The exceptio non adimpleti contractus lets the innocent party withhold performance until the guilty party performs or tenders performance, but it cannot be used where the agreement says rent must be paid timeously and in full, because the parties can contract out of it.", 'exceptio', 245);
    row(m, p, 2, "Cancellation ends the contract.", 'cancellation', 333);
    row(m, p, 3, "Specific performance is a court order compelling the breaching party to perform in terms of the contract.", 'specific', 421);
    row(m, p, 4, "Damages compensate for loss caused by the breach and put the innocent party in the financial position they would have been in had the contract been honoured.", 'damages', 509);
    row(m, p, 5, "A penalty clause provides a pre-agreed sum if a party breaches.", 'penalties', 597);
  }],
  ['wear', 'Wear', (m) => {
    const p = panel(0);
    head(p, "Wear", 150, .2, { size: 34 });
    row(m, p, 1, "Fair wear and tear is any decline resulting from ordinary use and exposure over time, including breakage or malfunction due to age or a deteriorated condition, but not where the decline results from negligence, carelessness, accidents or abuse by the tenant or the tenant's visitors.", 'definition', 245);
    row(m, p, 2, "Examples are old warped window frames, paint faded in the ordinary course, plaster cracked as the building settles, and carpets worn from being walked on.", 'examples', 333);
    row(m, p, 3, "Conversely, windows damaged by being slammed, walls damaged by nails or screws, paint discoloured by cigarette or candle smoke, carpets discoloured by pets or stains, and kitchen counters scratched by cutting are damage for the tenant's account.", 'damage', 421);
  }],
  ['cpa', 'Cpa', (m) => {
    const p = panel(0);
    head(p, "Cpa", 150, .2, { size: 34 });
    row(m, p, 1, "The CPA applies to all transactions in South Africa unless exempt, and a transaction is an agreement between or among persons for the supply or potential supply of goods or services in exchange for consideration, provided the person is acting in the ordinary course of business.", 'applies', 245);
    row(m, p, 2, "Ordinary course of business means the continual marketing of any good or service, such as regularly renting out a flat.", 'ordinary', 333);
    row(m, p, 3, "Someone in the mix has to be a natural person for the CPA to apply, and section 14(1) does not apply to transactions between juristic persons regardless of turnover or asset value.", 'natural', 421);
    row(m, p, 4, "Section 14(2) lets the consumer cancel a fixed-term agreement at expiry without penalty, or at any other time on 20 business days' notice, and the supplier may cancel 20 business days after written notice of a material failure unless the consumer rectifies it.", 's14', 509);
    row(m, p, 5, "The supplier must give 40 to 80 business days' notice before expiry of the impending expiry date and the options available, and on expiry the agreement continues month-to-month unless the consumer directs termination or agrees to renewal.", 'notice80', 597);
    row(m, p, 6, "On cancellation the consumer remains liable for amounts owed to the date of cancellation, the supplier may impose a reasonable cancellation penalty, and must credit amounts that remain the consumer's property, with regulation 5(2) listing the reasonableness factors.", 'penalty', 685);
  }],
  ['tribunal', 'Tribunal', (m) => {
    const p = panel(0);
    head(p, "Tribunal", 150, .2, { size: 34 });
    row(m, p, 1, "The Tribunal is a forum to resolve disputes between landlords and tenants in residential leases, it is free and easy to access, and legal representation is not needed.", 'forum', 245);
    row(m, p, 2, "A judgment by the Tribunal has the same power as a Magistrates' Court judgment under section 13(13) of the RHA.", 'judgment', 333);
    row(m, p, 3, "It can summon or subpoena a landlord or tenant to a hearing or mediation, issue mandatory or prohibitory interdicts requiring compliance with the Act, impose fines, and determine a fair rent.", 'powers', 421);
    row(m, p, 4, "Use the Tribunal for rental-housing disputes of this kind rather than approaching the ordinary courts first.", 'route', 509);
  }],
  ['q1', 'Quick check', () => { panel(0); }, { dur: 12, ask: done => quiz(BAND, [{
    id: 'c-q1', prompt: ["The exceptio non adimpleti contractus\u2026"],
    build: choice(["allows the innocent party to withhold performance until the other performs, but can be excluded by agreement", "is a remedy for damages", "can never be excluded by a clause in the lease", "applies only to sale agreements"], 0,
      "Correct: the innocent party may withhold performance, but the deck notes that a clause requiring rent to be paid timeously and in full contracts out of it.",
      [null, "Incorrect: it is a defence, not a damages claim.", "Incorrect: the deck expressly says the parties can contract out.", "Incorrect: it applies to leases as well."]),
  }], done) }],
  ['q2', 'Additional quick check', () => { panel(0); }, { dur: 12, ask: done => quiz(BAND, [{
    id: 'c-q2', prompt: ["The Consumer Protection Act does not apply to\u2026"],
    build: choice(["transactions between natural persons", "transactions between juristic persons, regardless of turnover or asset value", "transactions in the ordinary course of business", "fixed-term consumer agreements"], 1,
      "Correct: s 14(1) excludes transactions between juristic persons regardless of annual turnover or asset value.",
      ["Incorrect: a natural person on one side is what brings the CPA in.", null, "Incorrect: ordinary course of business is required for the CPA to apply.", "Incorrect: fixed-term agreements are regulated by s 14."]),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    head(p, "To sum up", 140, .2, { size: 34 });
    row(m, p, 1, "Breach takes five forms: positive malperformance, mora debitoris, mora creditoris, repudiation and prevention of performance.", 'w1', 245);
    row(m, p, 2, "Remedies are the exceptio, cancellation, specific performance, damages and penalties.", 'w2', 333);
    row(m, p, 3, "Fair wear and tear is ordinary decline, while negligence damage is for the tenant's account.", 'w3', 421);
    row(m, p, 4, "The CPA applies where a natural person is involved and the supplier acts in the ordinary course of business, and the Rental Housing Tribunal can resolve these disputes.", 'w4', 509);
    text(m, p, "Now try the chapter practice.", 800, 612, m('end'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [
  {
    id: 'p-wear', prompt: ["Which of these is fair wear and tear rather than damage for the tenant's account?"],
    build: choice(["A window damaged by being slammed", "Paint that has faded in the ordinary course", "A wall damaged by nails or screws", "A carpet discoloured by pet stains"], 1,
      "Correct: faded paint is ordinary decline from use and exposure; the other three are caused by negligence or abuse.",
      ["Incorrect: that is negligence damage.", null, "Incorrect: that is damage caused by the tenant.", "Incorrect: that is staining from pets."]),
  },
  {
    id: 'p-cpa', prompt: ["What notice must a supplier give before the expiry of a fixed-term consumer agreement?"],
    build: choice(["At least 20 business days", "Not more than 80 and not less than 40 business days", "At least 60 calendar days", "No notice is required"], 1,
      "Correct: s 14(2)(c) requires notice of not more than 80 and not less than 40 business days before expiry, covering material changes and the options available.",
      ["Incorrect: 20 business days is the cancellation notice period.", null, "Incorrect: the period is counted in business days and is a range.", "Incorrect: notice is compulsory."]),
  }
  ], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
