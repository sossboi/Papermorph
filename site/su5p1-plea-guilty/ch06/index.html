<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special Pleas — Study Unit 5 Part 1</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 6, title: 'Special Pleas', minutes: 10, language: 'en', next: null };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Special Pleas', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 5 Part 1', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Special Pleas', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'One line that says what this chapter is for.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 'Autrefois acquit or convict', 800, 180, m('autrefois'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Pardon by the President', 800, 260, m('pardon'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Jurisdiction', 800, 320, m('jurisdiction'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Lack of authority of prosecutor', 800, 380, m('authority'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Lis pendens', 800, 440, m('lispendens'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Unreasonable delay', 800, 500, m('delay'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Discharge from prosecution (s 204)', 800, 560, m('discharge'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Autrefois: Same offence, Competent court, Merits', 800, 620, m('scm'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-autrefois', prompt: ['The three essentials of autrefois acquit are...'],
    build: choice(['Same offence, competent court, merits', 'Same accused, same judge, same court', 'Same charge, same evidence, same verdict'], 0, 'Correct: autrefois requires the same offence, a competent court, and the merits.', [null, 'The judge is not an essential.', 'The evidence and verdict are not the test.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-autrefois', prompt: ['The onus of proving a special plea lies on the accused. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: the onus is on the accused.', [null, 'Incorrect: the accused bears the onus.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
