<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correction of Plea: s 113 — Study Unit 5 Part 1</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 3, title: 'Correction of Plea: s 113', minutes: 8, language: 'en', next: '../ch04/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Correction of Plea: s 113', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 5 Part 1', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Correction of Plea: s 113', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'A guilty plea can be corrected under section 113.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 's 113: mandatory, tested on DOUBT', 800, 180, m('doubt'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Doubt about guilt', 800, 260, m('doubtguilt'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Allegation not admitted', 800, 320, m('notadmitted'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Allegation incorrectly admitted', 800, 380, m('incorrect'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Valid defence', 800, 440, m('defence'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Any other reason', 800, 500, m('other'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Test: only doubt, not probabilities', 800, 560, m('test'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-s113', prompt: ['The test for s 113 is...'],
    build: choice(['Doubt', 'Probabilities', 'A balance of probabilities'], 0, 'Correct: s 113 is mandatory and tested on doubt only.', [null, 'Probabilities are not the test.', 'A balance of probabilities is a civil test.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-s113', prompt: ['An admission that is not withdrawn still stands as proof against the accused. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: admissions not withdrawn stand as proof.', [null, 'Incorrect: unwithdrawn admissions stand as proof.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
