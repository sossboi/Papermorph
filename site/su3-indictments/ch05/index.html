<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 5, title: 'Splitting of Charges and Joinder', minutes: 10, language: 'en', next: '../ch06/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Splitting of Charges and Joinder', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 3', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Splitting of Charges and Joinder', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Charges can be split, and accused can be joined.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 's 83: targets CONVICTIONS, not charges', 800, 180, m('convictions'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Single-intent test AND same-evidence test', 800, 260, m('tests'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 's 81: joinder of offences', 800, 320, m('joinder'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Before any evidence is led', 800, 380, m('evidence'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-splitting', prompt: ['The rule against splitting of charges targets the duplication of...'],
    build: choice(['Convictions', 'Charges', 'Witnesses'], 0, 'Correct: the rule targets convictions, not charges (Grobler).', [null, 'Charges may be formulated freely; convictions are restricted.', 'Witnesses are not the concern of s 83.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 83: single-intent and same-evidence tests', 'w1'],
      ['s 81: joinder before any evidence led', 'w2'],
      ['s 112(1)(b) questioning counts as evidence led', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-s81', prompt: ['Section 81 allows joinder of offences only after evidence has been led. True or false?'],
    build: choice(['True', 'False'], 1, 'Correct: joinder must happen before any evidence is led.', ['Incorrect: s 81(1) requires joinder before evidence is led.', null]),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
