<script>
'use strict';
const CHAPTER = { number: 4, title: 'Defects, Cures and Amendments: s 88 and s 86', minutes: 10, language: 'en', next: '../ch05/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Defects, Cures and Amendments: s 88 and s 86', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 3', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Defects, Cures and Amendments: s 88 and s 86', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'A defect can be cured, or it can fatal to the charge.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 's 88: automatic cure by evidence at trial', 800, 180, m('cure'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'UNLESS raised before judgment', 800, 260, m('unless'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 's 86: court-ordered amendment', 800, 320, m('amend'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Only if no prejudice to the accused', 800, 380, m('prejudice'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-s88', prompt: ['Under s 88, a defective charge is cured by evidence unless...'],
    build: choice(['The defect is raised before judgment', 'The accused is convicted', 'The trial is postponed'], 0, 'Correct: s 88 applies only if the defect is not raised before judgment.', [null, 'Conviction is the result, not the trigger.', 'Postponement does not affect s 88.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 88: automatic cure by evidence', 'w1'],
      ['s 86: court-ordered amendment before judgment', 'w2'],
      ['Test throughout: prejudice to the accused', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-s86', prompt: ['Section 86 allows the court to amend a charge whether or not it discloses an offence. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: s 86 expressly allows this.', [null, 'Incorrect: s 86 expressly allows this.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
