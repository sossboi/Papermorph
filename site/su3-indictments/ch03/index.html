<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 3, title: 'Form and Substance: s 84', minutes: 10, language: 'en', next: '../ch04/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Form and Substance: s 84', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 3', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Form and Substance: s 84', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'The charge must state the offence with enough substance.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 's 84: charge must set out the offence', 800, 180, m('must'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Particulars: time and place', 800, 260, m('time'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Person against whom committed', 800, 320, m('person'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Property in respect of which', 800, 380, m('property'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Reasonably sufficient to inform the accused', 800, 440, m('sufficient'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-s84', prompt: ['Under s 84, a charge must be reasonably sufficient to...'],
    build: choice(['Inform the accused of the nature of the charge', 'Prove the accused guilty', 'List all evidence'], 0, 'Correct: s 84 requires sufficient particulars to inform the accused.', [null, 'That is the State burden at trial.', 'Evidence is led at trial, not in the charge.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 84: charge must disclose an offence', 'w1'],
      ['Particulars: time, place, person, property', 'w2'],
      ['Statutory offence: words of enactment suffice (s 84(3))', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-s84', prompt: ['For a statutory offence, the words of the enactment suffice to disclose the offence. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: s 84(3) expressly provides this.', [null, 'Incorrect: s 84(3) makes this clear.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
