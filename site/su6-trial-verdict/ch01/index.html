<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'Trial Principles: FLIP-JOF', minutes: 8, language: 'en', next: '../ch02/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Trial Principles: FLIP-JOF', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 6', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Trial Principles: FLIP-JOF', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'The trial ends in a verdict the court must justify.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 'Fairness', 800, 180, m('fairness'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Legality', 800, 260, m('legality'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Impartiality', 800, 320, m('impartiality'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Public', 800, 380, m('public'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Equality of arms', 800, 440, m('equality'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Judicial control', 800, 500, m('control'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Orality', 800, 560, m('orality'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Finality', 800, 620, m('finality'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Fairness: s 35(3) Constitution', 800, 680, m('section35'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Legality: State proves legal guilt', 800, 740, m('legal'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Presiding officer: passive umpire', 800, 800, m('umpire'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-flipjof', prompt: ['The seven trial principles are remembered as...'],
    build: choice(['FLIP-JOF', 'FLIP-JOP', 'FLAP-JOF'], 0, 'Correct: FLIP-JOF stands for the seven trial principles.', [null, 'The mnemonic is FLIP-JOF.', 'The mnemonic is FLIP-JOF.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-fairness', prompt: ['Fairness in the trial principles comes from s 35(3) of the Constitution. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: fairness is in s 35(3).', [null, 'Incorrect: s 35(3) is the source of fairness.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
