<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Defence Case — Study Unit 6</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 4, title: 'The Defence Case', minutes: 8, language: 'en', next: '../ch05/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'The Defence Case', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 6', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'The Defence Case', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'The defence case follows the State case.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 'Three options after discharge refused', 800, 180, m('options'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Close the case passively', 800, 260, m('passive'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Give a defence address', 800, 320, m('address'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Testify and call witnesses', 800, 380, m('active'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Accused testifies before defence witnesses', 800, 440, m('order'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Court may allow deviation on good cause', 800, 500, m('deviation'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Right to remain silent (s 35(3)(h))', 800, 560, m('silent'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-options', prompt: ['After discharge is refused, the accused may...'],
    build: choice(['Close the case passively', 'Appeal immediately', 'Demand a new judge'], 0, 'Correct: the accused may close the case passively, give an address, or testify.', [null, 'Appeal comes after judgment.', 'A new judge is not an option at this stage.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-order', prompt: ['The accused must testify before calling defence witnesses. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: the accused testifies before defence witnesses, unless the court allows otherwise.', [null, 'Incorrect: that is the normal order.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
