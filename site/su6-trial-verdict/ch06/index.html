<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competent Verdicts — Study Unit 6</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 6, title: 'Competent Verdicts', minutes: 10, language: 'en', next: null };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Competent Verdicts', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 6', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Competent Verdicts', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'One line that says what this chapter is for.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 'Statutory basis required', 800, 180, m('statute'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'ss 256-270 list competent verdicts', 800, 260, m('sections'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'If express charge proved, no competent verdict', 800, 320, m('express'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Proof beyond reasonable doubt', 800, 380, m('proof'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Competent verdict = acquittal on original charge', 800, 440, m('acquittal'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Robbery: unique double competent verdict', 800, 500, m('robbery'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-competent', prompt: ['Competent verdicts exist only where...'],
    build: choice(['A statute permits them', 'The court has discretion', 'The accused consents'], 0, 'Correct: competent verdicts require a statutory basis (ss 256-270).', [null, 'The court cannot create competent verdicts.', 'Consent is irrelevant to competent verdicts.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-robbery', prompt: ['Robbery has a unique double competent verdict: theft and assault. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: robbery uniquely carries both theft and assault as competent verdicts.', [null, 'Incorrect: robbery has this double competent verdict.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
