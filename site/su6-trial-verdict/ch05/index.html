<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Verdict and Reasons — Study Unit 6</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 5, title: 'The Verdict and Reasons', minutes: 8, language: 'en', next: '../ch06/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'The Verdict and Reasons', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 6', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'The Verdict and Reasons', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'The court gives a verdict and reasons.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 'Judgment on the merits', 800, 180, m('merits'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Delivered in open court', 800, 260, m('open'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Reasons required for each conviction', 800, 320, m('reasons'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Intelligent analysis of the evidence', 800, 380, m('analysis'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Absence of reasons = no reasons', 800, 440, m('absence'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Verdict within a reasonable time', 800, 500, m('time'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-reasons', prompt: ['The accused is entitled to reasons for...'],
    build: choice(['Each conviction', 'The sentence only', 'The verdict only'], 0, 'Correct: reasons are required for each conviction.', [null, 'Reasons are needed for each conviction, not only the sentence.', 'The verdict alone is not enough.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-time', prompt: ['The verdict must be delivered within a reasonable time. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: the verdict must be delivered within a reasonable time.', [null, 'Incorrect: reasonable time is required.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
