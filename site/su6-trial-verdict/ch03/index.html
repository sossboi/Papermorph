<script>
'use strict';
const CHAPTER = { number: 3, title: 'Discharge at Close of State Case: s 174', minutes: 10, language: 'en', next: '../ch04/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Discharge at Close of State Case: s 174', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 6', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Discharge at Close of State Case: s 174', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Section 174 discharges the accused at the close of the State case.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 's 174: discharge at close of State case', 800, 180, m('allow'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Test: no evidence for reasonable conviction', 800, 260, m('test'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Question of law, not fact', 800, 320, m('law'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Credibility generally not considered', 800, 380, m('cred'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Modern test: Lubaxa, read with Schuping', 800, 440, m('lubaxa'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Discharge = acquittal on the merits', 800, 500, m('acquittal'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-s174', prompt: ['Under s 174, the test is whether there is...'],
    build: choice(['No evidence on which a reasonable court might convict', 'Some evidence of guilt', 'Proof beyond reasonable doubt'], 0, 'Correct: discharge is granted where no evidence exists for a reasonable conviction.', [null, 'Some evidence would defeat discharge.', 'Proof beyond reasonable doubt is the trial test, not the s 174 test.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-lubaxa', prompt: ['In S v Lubaxa, the SCA held that a s 174 discharge is an acquittal on the merits. True or false?'],
    build: choice(['True', 'False'], 1, 'Correct: Lubaxa sets the test for discharge, not the consequence; a discharge has the same effect as an acquittal.', ['Incorrect: Lubaxa is about the test for discharge (no evidence on which a reasonable court might convict).', null]),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
