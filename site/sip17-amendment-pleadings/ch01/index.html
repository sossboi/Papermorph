<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amendment of Pleadings — SIP421</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 17, title: 'Amendment of Pleadings', minutes: 10, language: 'en' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Amendment of Pleadings', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'SIP421 · Chapter 17', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Amendment of Pleadings', { x: 800, y: 430, size: 64, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Pleadings can be amended, and the court controls when.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['idea', 'Key idea', (m) => {
    const p = panel(0);
    const rows = [["Purpose: ventilate the real dispute", "ventilation"], ["Moolman: always allowed unless mala fide", "moolman"], ["B.P.C.: bona fide, prejudice, curable", "bpc"], ["Affidavits are never amended", "affidavits"], ["Delay alone is never decisive", "delay"], ["Three tiers: FAN, WS, PJEA", "fan"]];
    rows.forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 104, o: 0 });
      mk('circle', { cx: 200, cy: -10, r: 24, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: 0, size: 28, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 258, size: 30, weight: 500 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-moolman', prompt: ["The Moolman formula provides that amendments will always be allowed unless..."],
    build: choice(["The party delays too long", "Mala fide, or the injustice cannot be compensated by costs", "The opposing party objects"], 1, "Correct: the two grounds are mala fides and prejudice that costs cannot cure.", [null, "Delay alone is never decisive.", "An objection triggers the court's discretion but is not itself a ground of refusal."]),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    const rows = [["To sum up.", "w1"], ["B.P.C.: bona fide, prejudice, curable by costs or postponement.", "w2"], ["Affidavits are never amended, only supplemented.", "w3"]];
    rows.forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-affidavit', prompt: ["An affidavit may be amended by filing a notice of amendment. True or false?"],
    build: choice(["True", "False"], 1, "Correct: affidavits are never amended; a further supplementary affidavit is filed instead.", [null, "Incorrect: an affidavit is given under oath and cannot be redrafted."]),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
