<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defective Processes and Non-Compliance — SIP421</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">

<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 14, title: 'Defective Processes and Non-Compliance', minutes: 10, language: 'en' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Defective Processes and Non-Compliance', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'SIP421 · Chapter 14', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Defective Processes and Non-Compliance', { x: 800, y: 430, size: 64, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'A defective process can be cured, or it can end the case.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['idea', 'Key idea', (m) => {
    const p = panel(0);
    const rows = [["Exception attacks the whole pleading", "esic"], ["Strike out attacks part of a pleading", "strike"], ["Irregular step: HCR 30 / MCR 60A", "irregular"], ["Condonation needs good cause", "condonation"], ["Salzmann v Holmes: the dividing line", "salzmann"], ["Beinash v Wixley: two requirements", "beinash"]];
    rows.forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 104, o: 0 });
      mk('circle', { cx: 200, cy: -10, r: 24, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: 0, size: 28, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 258, size: 30, weight: 500 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-exception', prompt: ["An exception may be taken to..."],
    build: choice(["A pleading, but not an affidavit", "An affidavit, but not a pleading", "Both a pleading and an affidavit"], 0, "Correct: an exception lies only to a pleading; an affidavit cannot be excepted to.", [null, "An affidavit cannot be excepted to; strike out is the remedy for an affidavit.", "An exception does not lie to an affidavit."]),
  }], done) }],
  ['q2', 'Additional quick check', () => { panel(0); }, { dur: 12, ask: done => quiz(BAND, [{
    id: 'c-strikeout', prompt: ["Under Beinash v Wixley, strike out requires that the matter be scandalous, vexatious or irrelevant, and that…"],
    build: choice(["The opponent would be prejudiced by it", "The pleading discloses no cause of action", "The defect goes to jurisdiction"], 0, "Correct: Beinash v Wixley requires two things — the matter is scandalous, vexatious or irrelevant, and the opponent would be prejudiced.", ["Incorrect: a pleading that discloses no cause of action is met by an exception, not strike out.", "Incorrect: a jurisdictional defect makes the process void, which is a different remedy altogether."]),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    const rows = [["To sum up.", "w1"], ["Exception attacks the whole pleading; strike out attacks part.", "w2"], ["Irregular step: HCR 30 or MCR 60A, lost by a further step with knowledge.", "w3"]];
    rows.forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-simplesummons', prompt: ["An exception may be taken to a simple summons. True or false?"],
    build: choice(["True", "False"], 1, "Correct: an exception cannot be taken to a simple summons.", [null, "Incorrect: only a combined summons may be excepted to."]),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
