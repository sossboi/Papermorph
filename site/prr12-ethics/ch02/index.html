<script>
'use strict';
const CHAPTER = { number: 2, title: "Duties to the State, the Court and the Opponent", minutes: 13, language: 'en', next: '../ch03/' };

/* ---------- chapter drawing helpers ---------- */
const text = (m, p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const row = (m, p, n, str, mark, y) => {
  const g = G(p, { x: -16, y, o: 0 });
  mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
  T(g, String(n), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
  // Wrap to a fixed pixel budget, then shrink the type if the block would still be
  // taller than one row pitch. The block is centred on y, and the line offsets are
  // LOCAL to the group (which already sits at y), so they are emitted as top - y.
  const words = str.split(' ');
  const TOP = 200, BOT = 884, MAXH = 84, AVAIL = 1000;
  const wrapAt = (size) => {
    const out = []; let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (line && uiW(t, size) > AVAIL) { out.push(line); line = w; } else { line = t; }
    }
    if (line) out.push(line);
    return out;
  };
  let size = 21, lines = wrapAt(21);
  for (const s of [32, 28, 24]) {
    const cand = wrapAt(s);
    if ((cand.length - 1) * 30 <= MAXH) { size = s; lines = cand; break; }
  }
  const lh = Math.min(30, MAXH / Math.max(1, lines.length - 1));
  let top = y - ((lines.length - 1) * lh) / 2;
  if (top < TOP) top = TOP;
  if (top + (lines.length - 1) * lh > BOT) top = BOT - (lines.length - 1) * lh;
  lines.forEach((l, i) => { T(g, l, { x: 260, y: top + i * lh - y, size, weight: 600 }); });
  tw(g, { o: 1, x: 0 }, m(mark), .6);
  return g;
};
const head = (p, str, y, t0, { size = 34, fill = COL.task, weight = 700 } = {}) => { const e = T(p, str, { x: 800, y, size, fill, anchor: 'middle', weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', '"PRR400 \u00b7 Study Unit 12"', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, "Duties to the State, the Court and the Opponent", { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, "Duties to the State, the Court and the Opponent", { x: 800, y: 430, size: 54, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(m, scene, "Duties owed to the State, the court and the opposition.", 800, 600, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['state', 'State', (m) => {
    const p = panel(0);
    head(p, "State", 150, .2, { size: 34 });
    row(m, p, 1, "Attorneys and advocates are admitted as legal practitioners on application to the High Court under section 34 of the LPA, take an oath including faithfulness to the Republic, and the High Court permits enrolment by the LPC.", 'admitted', 245);
    row(m, p, 2, "They must obey the laws of the country, uphold the law, show respect for the legal order and further the administration of justice.", 'obey', 333);
    row(m, p, 3, "Prince v President, Law Society of the Cape of Good Hope shows how respect for the law as part of fitness interacts with constitutional rights, and the deck leaves the follow-up question open.", 'prince', 421);
    row(m, p, 4, "Incorporated Law Society v Mandela: a conviction for political dissent against an unjust order does not itself equal dishonourable conduct.", 'mandela', 509);
    row(m, p, 5, "Society of Advocates v Fisher: absconding in breach of bail is a breach of faith, by contrast.", 'fisher', 597);
  }],
  ['breaklaw', 'Breaklaw', (m) => {
    const p = panel(0);
    head(p, "Breaklaw", 150, .2, { size: 34 });
    row(m, p, 1, "You must advise against it and explain the consequences.", 'advise', 245);
    row(m, p, 2, "You must not facilitate, assist, give advice that contravenes any law, or devise a scheme involving an offence, under CoC 9.2.", 'mustnot', 333);
    row(m, p, 3, "You may advise whether an act, omission or course of conduct is legal or illegal under CoC 9.3, including pointing out lawful loopholes.", 'may', 421);
    row(m, p, 4, "The line is between advising on the law and devising an unlawful scheme.", 'line', 509);
  }],
  ['court', 'Court', (m) => {
    const p = panel(0);
    head(p, "Court", 150, .2, { size: 34 });
    row(m, p, 1, "A practitioner is an officer of the court, and there is a relationship of trust: the court must be able to believe what a practitioner says without investigating.", 'officer', 245);
    row(m, p, 2, "Misleading includes false statements to the court, failing to direct the court to relevant authority, and non-disclosure of material facts.", 'mislead', 333);
    row(m, p, 3, "Disclose all relevant information to the court even if it is detrimental to the client's case.", 'disclose', 421);
    row(m, p, 4, "CoC 57.1 requires all reasonable steps to avoid misleading a court; 57.4 requires disclosure of every material fact in ex parte proceedings; 57.5 requires disclosure of adverse authorities; 57.9 prohibits relying on evidence you know to be false.", 'coc57', 509);
    row(m, p, 5, "In Society of Advocates v Merret an attorney was struck off for a deliberate misstatement to the judge, even without personal gain.", 'merret', 597);
  }],
  ['guilty', 'Guilty', (m) => {
    const p = panel(0);
    head(p, "Guilty", 150, .2, { size: 34 });
    row(m, p, 1, "The State bears the onus to prove guilt beyond reasonable doubt, and there is no duty on the practitioner to assist the State.", 'onus', 245);
    row(m, p, 2, "Even if the client confesses, the client may still plead not guilty, because the State must prove its case.", 'plead', 333);
    row(m, p, 3, "But the defence may not present a false version, mislead the court, or assist the client to lie to it.", 'not', 421);
    row(m, p, 4, "Cross-examining on the accuracy of observations and the ability to identify the accused is allowed.", 'may2', 509);
    row(m, p, 5, "Under CoC 9.5, explain that you may not assert a fact you know to be untrue, may not put forward an affirmative case inconsistent with the confession, but may argue the evidence is insufficient and use any point of law; let the client choose, and keep the confession privileged.", 'confess', 597);
    row(m, p, 6, "Silence is permitted; lying is not.", 'line2', 685);
  }],
  ['opponent', 'Opponent', (m) => {
    const p = panel(0);
    head(p, "Opponent", 150, .2, { size: 34 });
    row(m, p, 1, "There is a general duty of fairness, courtesy, honesty and trust under CoC 3.14, and its content depends on the case.", 'duty', 245);
    row(m, p, 2, "In Barlow Rand v Lebos the court found a duty of care exists, but the claim failed on exception because no negligence or intention was alleged and causation was not properly pleaded.", 'barlow', 333);
    row(m, p, 3, "CoC 61.12 forbids deliberately seeking to catch an opposing practitioner off-guard, so hand up an identical set of heads of argument, a list of authorities, a copy of any transcript, notice of a point of law not evident from the papers, and a copy of any unreported judgment.", 'ambush', 421);
    row(m, p, 4, "Heads, authorities, transcripts, points of law, unreported judgments.", 'remember', 509);
  }],
  ['thirdparty', 'Thirdparty', (m) => {
    const p = panel(0);
    head(p, "Thirdparty", 150, .2, { size: 34 });
    row(m, p, 1, "When drawing a contract between your client and an unrepresented third party you owe that person a duty to act fairly: explain the importance and consequences of the agreement, ensure they can take an informed decision, advise them to get their own attorney if a conflict prevents proper explanation, and never exploit their lack of understanding.", 'leite', 245);
    row(m, p, 2, "CoC 59 governs witness interviews: interview in the presence of the instructing attorney, interview credibility witnesses separately, take an ordinary statement rather than an affidavit unless the evidence goes in by affidavit, and notify the opponent before any mid-testimony interview.", 'witness', 333);
    row(m, p, 3, "In Shabalala, a blanket prohibition on interviewing State witnesses is too wide: ask the prosecuting authority, and if refused apply to court, but the witness may still refuse.", 'state', 421);
  }],
  ['q1', 'Quick check', () => { panel(0); }, { dur: 12, ask: done => quiz(BAND, [{
    id: 'c-q1', prompt: ["A practitioner who knows the client is guilty may\u2026"],
    build: choice(["withdraw and report the confession to the court", "put the client on the stand to lie, because the State must prove its case", "hold the State to its proof while not asserting or implying any fact known to be untrue", "refuse to cross-examine any State witness"], 2,
      "Correct: CoC 9.5 permits arguing that the evidence is insufficient and using any point of law, but forbids asserting a false fact or putting forward an inconsistent affirmative case; the confession stays privileged.",
      ["Incorrect: the confession is privileged and may not be revealed.", "Incorrect: the defence may never present a false version.", null, "Incorrect: cross-examination on accuracy and identification is allowed."]),
  }], done) }],
  ['q2', 'Additional quick check', () => { panel(0); }, { dur: 12, ask: done => quiz(BAND, [{
    id: 'c-q2', prompt: ["CoC 61.12 requires a practitioner to hand up\u2026"],
    build: choice(["only the heads of argument", "heads of argument, a list of authorities, a copy of any transcript, notice of a new point of law, and a copy of any unreported judgment", "only the bundle of documents", "nothing, unless the rules of court compel it"], 1,
      "Correct: those five categories are the anti-ambush obligations in CoC 61.12.1 to 61.12.5.",
      ["Incorrect: the heads are only one of five categories.", null, "Incorrect: the document bundle is not the CoC 61.12 list.", "Incorrect: the Code imposes these duties independently of the rules of court."]),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    head(p, "To sum up", 140, .2, { size: 34 });
    row(m, p, 1, "The State is owed obedience to the law and respect for the legal order, and fitness interacts with constitutional rights.", 'w1', 245);
    row(m, p, 2, "The court is owed candour: disclose material facts and adverse authorities, and never mislead, on pain of being struck off.", 'w2', 333);
    row(m, p, 3, "A guilty client may still plead not guilty, but you may not construct a false story; silence is permitted, lying is not.", 'w3', 421);
    row(m, p, 4, "The opponent is owed fairness and no ambushes, and an unrepresented third party is owed a fair explanation.", 'w4', 509);
    text(m, p, "Now try the chapter practice.", 800, 612, m('end'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [
  {
    id: 'p-exparte', prompt: ["In an ex parte application, what must the practitioner disclose under CoC 57.4?"],
    build: choice(["Only the facts that support the application", "Every fact known that might reasonably materially bear on the court's decision, apart from privileged or confidential facts", "Nothing beyond the founding affidavit", "Only the authorities in the applicant's favour"], 1,
      "Correct: CoC 57.4 imposes a full disclosure duty in ex parte proceedings, subject to privilege and confidentiality.",
      ["Incorrect: the duty is not limited to helpful facts.", null, "Incorrect: the duty goes beyond the affidavit.", "Incorrect: adverse authorities fall under 57.5."]),
  },
  {
    id: 'p-witness', prompt: ["What is the correct route for a defence practitioner who wishes to interview a State witness?"],
    build: choice(["Approach the witness directly without asking anyone", "Ask the prosecuting authority for permission, and if refused apply to court", "Interview the witness only if the witness is not going to be called", "Refuse to interview any State witness"], 1,
      "Correct: Shabalala holds a blanket prohibition too wide; ask the prosecution, then apply to court, and note the witness may still refuse.",
      ["Incorrect: the route requires consent or leave.", null, "Incorrect: a State witness includes anyone from whom SAPS took a statement, whether or not they will be called.", "Incorrect: a blanket refusal is not the law."]),
  }
  ], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
