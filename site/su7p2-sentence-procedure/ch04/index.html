<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correctional Supervision — Study Unit 7 Part 2</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 4, title: 'Correctional Supervision', minutes: 10, language: 'en', next: '../ch05/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Correctional Supervision', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 7 Part 2', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Correctional Supervision', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Correctional supervision is a non-custodial option.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 's 276(1)(h): alone, max 3 years', 800, 180, m('hoption'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Probation report required', 800, 260, m('report'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'As condition to suspended sentence, max 5 years', 800, 320, m('condition'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 's 276(1)(i): imprisonment, max 5 years', 800, 380, m('ioption'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'No report needed', 800, 440, m('noreport'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 's 276A(3): Commissioner applies', 800, 500, m('commissioner'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-s276h', prompt: ['Under s 276(1)(h), a probation report is...'],
    build: choice(['Required', 'Not required', 'Discretionary'], 0, 'Correct: a probation report is required for s 276(1)(h).', [null, 'No report is needed for s 276(1)(i), but s 276(1)(h) requires one.', 'The report is mandatory for this option.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-s276i', prompt: ['Section 276(1)(i) requires a probation report before imposition. True or false?'],
    build: choice(['True', 'False'], 1, 'Correct: no report is needed for s 276(1)(i).', ['Incorrect: s 276(1)(i) needs no report.', null]),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
