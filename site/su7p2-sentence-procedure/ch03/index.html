<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms of Punishment: Imprisonment — Study Unit 7 Part 2</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">

<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 3, title: 'Forms of Punishment: Imprisonment', minutes: 10, language: 'en', next: '../ch04/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Forms of Punishment: Imprisonment', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 7 Part 2', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Forms of Punishment: Imprisonment', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'One line that says what this chapter is for.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 'Ordinary: not less than 4 days', 800, 180, m('ordinary'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Life: 25 years or 65 with 15 served', 800, 260, m('life'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Dangerous criminal: s 286A, indeterminate', 800, 320, m('dangerous'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Habitual criminal: s 286, 7-15 years', 800, 380, m('habitual'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Periodical: s 285, 100-2000 hours', 800, 440, m('periodical'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 's 276(1)(i): max 5 years, no report needed', 800, 500, m('ioption'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-life', prompt: ['Life imprisonment parole may be considered after...'],
    build: choice(['25 years or 65 with 15 served', '10 years', 'Half the term'], 0, 'Correct: parole for life imprisonment may be considered after 25 years or 65 with 15 served.', [null, '10 years is far too short for life imprisonment.', 'Half the term applies to ordinary imprisonment, not life.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-ordinary', prompt: ['Ordinary imprisonment may be imposed for not less than 4 days. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: ordinary imprisonment is not less than 4 days.', [null, 'Incorrect: 4 days is the minimum.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
