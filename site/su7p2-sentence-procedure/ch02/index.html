'use strict';
const CHAPTER = { number: 2, title: 'Restorative Justice and Therapeutic Jurisprudence', minutes: 10, language: 'en', next: '../ch03/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Restorative Justice and Therapeutic Jurisprudence', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 7 Part 2', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Restorative Justice and Therapeutic Jurisprudence', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Restorative justice shapes the sentence.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 'RJ: reparation and healing', 800, 180, m('repair'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });

    text(p, 'RJ viable in appropriate cases', 800, 320, m('viable'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Cautioned against for serious offences', 800, 380, m('caution'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Thabethe: suspended sentence for rape shockingly inappropriate', 800, 440, m('thabethe'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Victim views heard but not decisive', 800, 500, m('victim'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-thabethe', prompt: ['In Thabethe, the SCA held that...'],
    build: choice(['A suspended sentence for rape was shockingly inappropriate', 'A suspended sentence was appropriate', 'The sentence was too harsh'], 0, 'Correct: Thabethe held a suspended sentence for rape was shockingly inappropriate.', [null, 'The SCA upheld the suspended sentence.', 'The complaint was about leniency, not harshness.']),

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']

      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);

      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-rj', prompt: ['Restorative justice is viable in appropriate cases but cautioned against for serious offences. True or false?'],
