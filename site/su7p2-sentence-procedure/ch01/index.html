<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getting the Information the Court Needs — Study Unit 7 Part 2</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'Getting the Information the Court Needs', minutes: 10, language: 'en', next: '../ch02/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Getting the Information the Court Needs', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 7 Part 2', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Getting the Information the Court Needs', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'The procedure of sentencing, step by step.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 's 274: court receives evidence as it thinks fit', 800, 180, m('s274'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Oral testimony preferred', 800, 260, m('oral'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Statements from the bar: legal representatives', 800, 320, m('bar'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Previous convictions: SAP 69 fingerprint record', 800, 380, m('sap69'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'If denied: LCRC officer can be called', 800, 440, m('lcrc'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 's 271A: some fall away after 10 years', 800, 500, m('fall'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-s274', prompt: ['Under s 274, the court may receive...'],
    build: choice(['Such evidence as it thinks fit', 'Only oral testimony', 'Only documentary evidence'], 0, 'Correct: s 274 allows the court to receive such evidence as it thinks fit.', [null, 'Oral testimony is preferred but not exclusive.', 'Other evidence is also admissible.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sap69', prompt: ['Previous convictions are proved by the SAP 69 fingerprint record. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: the SAP 69 record proves previous convictions.', [null, 'Incorrect: SAP 69 is the proof.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
