<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 6, title: 'Parole and Medical Parole', minutes: 8, language: 'en', next: null };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Parole and Medical Parole', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 7 Part 2', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Parole and Medical Parole', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'One line that says what this chapter is for.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 'Parole: after half the term', 800, 180, m('half'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Victims may make representations', 800, 260, m('victims'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Medical parole: terminal or incapacitated', 800, 320, m('terminal'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Low risk of re-offending', 800, 380, m('risk'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Community care arrangements', 800, 440, m('care'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Not cancelled merely on improved condition', 800, 500, m('cancel'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-medical', prompt: ['Medical parole requires...'],
    build: choice(['Terminal disease or physical incapacity, low risk, and community care', 'Only a terminal illness', 'Only low risk of re-offending'], 0, 'Correct: medical parole requires all three: terminal/incapacitating condition, low risk, and community care.', [null, 'A terminal illness alone is not enough.', 'Low risk alone is not enough.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-cancel', prompt: ['Medical parole cannot be cancelled merely because the condition improved. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: improvement alone does not cancel medical parole.', [null, 'Incorrect: improvement is not a ground for cancellation.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
