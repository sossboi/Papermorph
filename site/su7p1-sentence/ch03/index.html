<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimum Sentences: s 51 — Study Unit 7 Part 1</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 3, title: 'Minimum Sentences: s 51', minutes: 10, language: 'en', next: '../ch04/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Minimum Sentences: s 51', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 7 Part 1', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Minimum Sentences: s 51', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'One line that says what this chapter is for.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 's 51: minimum sentences', 800, 180, m('prescribe'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Part I: life imprisonment', 800, 260, m('life'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Part II: 15 years (first offender)', 800, 320, m('part2'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Part III: 10 years', 800, 380, m('part3'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Part IV: 5 years', 800, 440, m('part4'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Part V: 3 years', 800, 500, m('part5'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Second and third offenders: longer minimums', 800, 560, m('repeat'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Permanent since 2008', 800, 620, m('permanent'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-part1', prompt: ['Under s 51, Part I attracts...'],
    build: choice(['Life imprisonment', '15 years', '10 years'], 0, 'Correct: Part I attracts life imprisonment.', [null, '15 years is Part II.', '10 years is Part III.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 51(1): life for aggravated murder/rape', 'w1'],
      ['s 51(2): 15 years for other murder/rape', 'w2'],
      ['Wrong subsection caps the court (Ndlovu)', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-permanent', prompt: ['The current s 51 minimum sentence regime took effect on 31 December 2007. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: the Criminal Law (Sentencing) Amendment Act 38 of 2007 took effect on 31 December 2007.', [null, 'Incorrect: it took effect on 31 December 2007.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
