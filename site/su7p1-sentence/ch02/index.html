<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentencing Jurisdiction — Study Unit 7 Part 1</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 2, title: 'Sentencing Jurisdiction', minutes: 8, language: 'en', next: '../ch03/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Sentencing Jurisdiction', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 7 Part 1', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Sentencing Jurisdiction', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Sentencing jurisdiction follows the charge and the court.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 'High Court: unlimited jurisdiction', 800, 180, m('highcourt'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'Regional Court: life only under s 51', 800, 260, m('regional'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Otherwise 15 years and R600 000 fine', 800, 320, m('rc2'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'District Court: 3 years and R120 000', 800, 380, m('district'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Adjustment of Fines Act: R40 000 per 12 months', 800, 440, m('ratio'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Appeal: only on recognised grounds', 800, 500, m('appeal'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-district', prompt: ['The District Court sentencing jurisdiction is...'],
    build: choice(['3 years and R120 000', '15 years and R600 000', 'Life imprisonment'], 0, 'Correct: the District Court may impose 3 years and a R120 000 fine.', [null, 'That is the Regional Court limit.', 'Life imprisonment is beyond the District Court.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-regional', prompt: ['The Regional Court may impose life imprisonment only where a minimum sentence applies. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: the Regional Court may impose life only where a minimum sentence applies.', [null, 'Incorrect: that is the limit of its life jurisdiction.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
