<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'The Zinn Triad and Rabie', minutes: 8, language: 'en', next: '../ch02/' };

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'The Zinn Triad and Rabie', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Study Unit 7 Part 1', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'The Zinn Triad and Rabie', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'One line that says what this chapter is for.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
    ['idea', 'Key idea', (m) => {
    const p = panel(0);
    text(p, 'The crime', 800, 180, m('crime'), { size: 40, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'The offender', 800, 260, m('offender'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'The interests of society', 800, 320, m('society'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Rabie: mercy blends the three', 800, 380, m('mercy'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Court must weigh all three together', 800, 440, m('weigh'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
    text(p, 'Individualisation justifies wide discretion', 800, 500, m('individual'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 500 });
  }],
  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-zinn', prompt: ['The Zinn triad consists of...'],
    build: choice(['Crime, offender, society', 'Crime, offender, victim', 'Offence, accused, sentence'], 0, 'Correct: the Zinn triad is the crime, the offender, and the interests of society.', [null, 'The victim is not a separate element of the triad.', 'Sentence is the outcome, not an element.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [
      ['s 35(3): fair trial right', 'w1'],
      ['Right to be informed of charge', 'w2'],
      ['Sufficient detail to answer', 'w3']
    ].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 300 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-rabie', prompt: ['Rabie added mercy as the element that blends the triad. True or false?'],
    build: choice(['True', 'False'], 0, 'Correct: Rabie added mercy as the blending element.', [null, 'Incorrect: Rabie added mercy.']),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
